<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeHub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9eef3;
}

/* APP FRAME */
.app {
  max-width: 420px;
  margin: auto;
  background: white;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* HEADER */
header {
  background: linear-gradient(135deg,#ff6b6b,#ff8e53);
  color: white;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
}

/* SEARCH */
.search {
  padding: 10px 15px;
}
.search input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #f3f3f3;
}

/* CATEGORIES */
.categories {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px;
}
.cat {
  background: #ff6b6b;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 15px;
}

.card {
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 110px;
  object-fit: cover;
}

.card p {
  margin: 8px;
  font-weight: bold;
}

/* BOTTOM NAV */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 420px;
  margin: auto;
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 10px;
  border-top: 1px solid #ddd;
}

.nav button {
  border: none;
  background: none;
  font-size: 12px;
}

/* MODAL (RECIPE DETAILS) */
.modal {
  position: fixed;
  bottom: -100%;
  left: 0;
  right: 0;
  background: white;
  max-width: 420px;
  margin: auto;
  padding: 20px;
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.modal.show {
  bottom: 0;
}

/* DARK MODE */
.dark {
  background: #121212;
  color: white;
}
</style>
</head>

<body>

<div class="app" id="app">

<header>🍽 RecipeHub</header>

<div class="search">
  <input placeholder="Search recipes...">
</div>

<div class="categories">
  <div class="cat">Breakfast</div>
  <div class="cat">Lunch</div>
  <div class="cat">Dinner</div>
  <div class="cat">Dessert</div>
</div>

<div class="grid">

  <div class="card" onclick="openRecipe('Pasta')">
    <img src="https://source.unsplash.com/300x200/?pasta">
    <p>Pasta</p>
  </div>

  <div class="card" onclick="openRecipe('Burger')">
    <img src="https://source.unsplash.com/300x200/?burger">
    <p>Burger</p>
  </div>

  <div class="card" onclick="openRecipe('Salad')">
    <img src="https://source.unsplash.com/300x200/?salad">
    <p>Salad</p>
  </div>

  <div class="card" onclick="openRecipe('Chicken')">
    <img src="https://source.unsplash.com/300x200/?chicken">
    <p>Chicken</p>
  </div>

</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <h2 id="title"></h2>
  <p>Delicious recipe details coming soon...</p>
  <button onclick="addFav()">❤️ Add to Favorites</button>
  <button onclick="closeModal()">Close</button>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="toggleDark()">🌙</button>
  <button onclick="showFav()">❤️</button>
  <button onclick="showMsg()">📅</button>
  <button onclick="showMsg()">🛒</button>
</div>

<script>
let current = "";

function openRecipe(name){
  current = name;
  document.getElementById("title").innerText = name;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function addFav(){
  let favs = JSON.parse(localStorage.getItem("favs")) || [];
  favs.push(current);
  localStorage.setItem("favs", JSON.stringify(favs));
  alert("Added to favorites!");
}

function toggleDark(){
  document.getElementById("app").classList.toggle("dark");
}

function showFav(){
  let favs = JSON.parse(localStorage.getItem("favs")) || [];
  alert("Favorites: " + favs.join(", "));
}

function showMsg(){
  alert("Feature coming soon in prototype demo");
}
</script>

</body>
</html>
