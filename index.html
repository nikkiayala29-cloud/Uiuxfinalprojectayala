<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeHub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fff7f0;
}

/* HEADER */
header{
  background:#ff6b00;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  position:relative;
}

.menu-btn{
  position:absolute;
  left:15px;
  top:15px;
  font-size:22px;
  cursor:pointer;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-240px;
  width:220px;
  height:100%;
  background:white;
  box-shadow:2px 0 10px rgba(0,0,0,0.2);
  padding:15px;
  transition:0.3s;
  z-index:999;
}

.sidebar a{
  display:block;
  padding:12px;
  text-decoration:none;
  color:#333;
  border-bottom:1px solid #eee;
}

/* SEARCH */
.search{
  padding:10px;
}

.search input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#f1f1f1;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  cursor:pointer;
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card p{
  margin:8px;
  font-weight:bold;
}

.card small{
  margin:8px;
  display:block;
  color:gray;
}

/* DETAIL */
.detail{
  display:none;
  padding:15px;
}

.detail img{
  width:100%;
  border-radius:12px;
}

/* BUTTON */
button{
  background:#ff6b00;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  RecipeHub UI/UX System
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <a onclick="renderRecipes()">🏠 Home</a>
  <a onclick="showFav()">❤️ Favorites</a>
</div>

<!-- SEARCH -->
<div class="search">
  <input id="search" onkeyup="searchRecipe()" placeholder="Search recipes or category...">
</div>

<!-- GRID -->
<div class="grid" id="home"></div>

<!-- DETAIL -->
<div class="detail" id="detail">

  <img id="img">
  <h2 id="title"></h2>

  <h3>Ingredients</h3>
  <p id="ingredients"></p>

  <h3>Instructions</h3>
  <p id="instructions"></p>

  <h3>Nutrition</h3>
  <p id="nutrition"></p>

  <button onclick="addFav()">❤️ Add to Favorites</button>
  <button onclick="back()">⬅ Back</button>
</div>

<script>

/* =========================
   DATA SYSTEM (SCALABLE)
========================= */
const recipes = [
  {
    id:1,
    name:"Chicken Adobo",
    category:"Filipino",
    image:"https://source.unsplash.com/300x200/?chicken",
    ingredients:["Chicken","Soy sauce","Vinegar","Garlic","Bay leaf"],
    instructions:"Marinate and simmer until tender.",
    nutrition:"320 kcal"
  },
  {
    id:2,
    name:"Sinigang na Baboy",
    category:"Filipino",
    image:"https://source.unsplash.com/300x200/?soup",
    ingredients:["Pork","Tamarind","Vegetables"],
    instructions:"Boil pork and add sour base.",
    nutrition:"280 kcal"
  },
  {
    id:3,
    name:"Spaghetti Bolognese",
    category:"International",
    image:"https://source.unsplash.com/300x200/?spaghetti",
    ingredients:["Pasta","Beef","Tomato sauce"],
    instructions:"Cook pasta and mix with sauce.",
    nutrition:"400 kcal"
  },
  {
    id:4,
    name:"Leche Flan",
    category:"Dessert",
    image:"https://source.unsplash.com/300x200/?dessert",
    ingredients:["Eggs","Milk","Sugar"],
    instructions:"Steam until set.",
    nutrition:"250 kcal"
  }
];

/* =========================
   STORAGE
========================= */
let favorites = JSON.parse(localStorage.getItem("fav")) || [];
let current = null;

/* =========================
   RENDER SYSTEM
========================= */
function renderRecipes(list = recipes){
  let home = document.getElementById("home");
  home.innerHTML = "";

  list.forEach(r=>{
    home.innerHTML += `
      <div class="card" onclick="openRecipe(${r.id})">
        <img src="${r.image}">
        <p>${r.name}</p>
        <small>${r.category}</small>
      </div>
    `;
  });
}
renderRecipes();

/* =========================
   OPEN RECIPE
========================= */
function openRecipe(id){
  let r = recipes.find(x=>x.id===id);
  current = r;

  document.getElementById("home").style.display="none";
  document.getElementById("detail").style.display="block";

  document.getElementById("title").innerText=r.name;
  document.getElementById("img").src=r.image;

  document.getElementById("ingredients").innerHTML =
    r.ingredients.map(i=>"• "+i).join("<br>");

  document.getElementById("instructions").innerText=r.instructions;
  document.getElementById("nutrition").innerText=r.nutrition;
}

/* =========================
   BACK
========================= */
function back(){
  document.getElementById("home").style.display="grid";
  document.getElementById("detail").style.display="none";
}

/* =========================
   SEARCH FILTER
========================= */
function searchRecipe(){
  let v = document.getElementById("search").value.toLowerCase();

  let filtered = recipes.filter(r =>
    r.name.toLowerCase().includes(v) ||
    r.category.toLowerCase().includes(v)
  );

  renderRecipes(filtered);
}

/* =========================
   FAVORITES SYSTEM
========================= */
function addFav(){
  favorites.push(current);
  localStorage.setItem("fav", JSON.stringify(favorites));
  alert("Added to Favorites ❤️");
}

/* =========================
   FAVORITES VIEW
========================= */
function showFav(){
  let home = document.getElementById("home");
  home.innerHTML = "";

  favorites.forEach(r=>{
    home.innerHTML += `
      <div class="card">
        <img src="${r.image}">
        <p>${r.name}</p>
        <small>${r.category}</small>
      </div>
    `;
  });
}

/* =========================
   MENU
========================= */
function toggleMenu(){
  let s = document.getElementById("sidebar");
  s.style.left = (s.style.left==="0px") ? "-240px" : "0px";
}

</script>

</body>
</html>
