<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeHub</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f5;
}

/* PHONE APP CONTAINER */
.app {
  max-width: 420px;
  margin: auto;
  background: white;
  min-height: 100vh;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
  position: relative;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #ff6b6b, #ff8e53);
  color: white;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
}

/* SEARCH BAR */
.search {
  padding: 15px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #f2f2f2;
}

/* CATEGORY SCROLL */
.categories {
  display: flex;
  overflow-x: auto;
  padding: 10px;
  gap: 10px;
}

.cat {
  background: #ff6b6b;
  color: white;
  padding: 8px 12px;
  border-radius: 20px;
  white-space: nowrap;
  font-size: 13px;
}

/* RECIPE CARDS */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.card:active {
  transform: scale(0.97);
}

.card img {
  width: 100%;
  height: 100px;
  object-fit: cover;
}

.card p {
  margin: 8px;
  font-size: 14px;
  font-weight: bold;
}

/* BOTTOM NAV (MOBILE STYLE) */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 10px;
  border-top: 1px solid #ddd;
  max-width: 420px;
  margin: auto;
}

.nav a {
  text-decoration: none;
  font-size: 12px;
  color: #333;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

<header>🍽 RecipeHub</header>

<div class="search">
  <input type="text" placeholder="Search recipes...">
</div>

<div class="categories">
  <div class="cat">Breakfast</div>
  <div class="cat">Lunch</div>
  <div class="cat">Dinner</div>
  <div class="cat">Dessert</div>
</div>

<div class="grid">

  <div class="card">
    <img src="https://source.unsplash.com/300x200/?pasta">
    <p>Pasta</p>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/300x200/?burger">
    <p>Burger</p>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/300x200/?salad">
    <p>Salad</p>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/300x200/?chicken">
    <p>Chicken</p>
  </div>

</div>

</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <a href="index.html">🏠<br>Home</a>
  <a href="recipes.html">🍲<br>Recipes</a>
  <a href="favorites.html">❤️<br>Fav</a>
  <a href="planner.html">📅<br>Plan</a>
  <a href="shopping.html">🛒<br>List</a>
</div>

</body>
</html>
