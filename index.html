<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeHub</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7f0;
}

/* HEADER */
header {
  background: #ff6b00;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* SEARCH */
.search {
  padding: 10px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

/* CARD */
.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 110px;
  object-fit: cover;
}

.card p {
  margin: 8px;
  font-weight: bold;
}

/* DETAIL VIEW */
.detail {
  display: none;
  padding: 15px;
}

.detail img {
  width: 100%;
  border-radius: 12px;
}

/* BUTTON */
button {
  background: #ff6b00;
  border: none;
  padding: 10px;
  color: white;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>🍽 RecipeHub</header>

<div class="search">
  <input id="search" onkeyup="searchRecipe()" placeholder="Search recipes...">
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- DETAIL -->
<div class="detail" id="detail">

  <img id="img">
  <h2 id="title"></h2>

  <h3>Ingredients</h3>
  <p id="ingredients"></p>

  <h3>Instructions</h3>
  <p id="instructions"></p>

  <h3>Nutrition</h3>
  <p id="nutrition"></p>

  <button onclick="goBack()">⬅ Back</button>

</div>

<script>

/* RECIPES DATABASE (SCALES TO 100+) */
const recipes = [
  {
    id: 1,
    name: "Chicken Adobo",
    image: "https://source.unsplash.com/300x200/?chicken",
    ingredients: "Chicken, soy sauce, vinegar, garlic, bay leaf",
    instructions: "Marinate chicken, simmer until tender and sauce thickens.",
    nutrition: "320 kcal"
  },
  {
    id: 2,
    name: "Sinigang na Baboy",
    image: "https://source.unsplash.com/300x200/?soup",
    ingredients: "Pork, tamarind, vegetables",
    instructions: "Boil pork then add sour base and vegetables.",
    nutrition: "280 kcal"
  },
  {
    id: 3,
    name: "Pancit Bihon",
    image: "https://source.unsplash.com/300x200/?noodles",
    ingredients: "Rice noodles, chicken, vegetables",
    instructions: "Stir-fry noodles with meat and vegetables.",
    nutrition: "300 kcal"
  },
  {
    id: 4,
    name: "Leche Flan",
    image: "https://source.unsplash.com/300x200/?dessert",
    ingredients: "Eggs, milk, sugar, vanilla",
    instructions: "Steam mixture until set and caramelized.",
    nutrition: "250 kcal"
  }
];

/* RENDER RECIPES */
function renderRecipes(list = recipes) {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  list.forEach(r => {
    grid.innerHTML += `
      <div class="card" onclick="openRecipe(${r.id})">
        <img src="${r.image}">
        <p>${r.name}</p>
      </div>
    `;
  });
}
renderRecipes();

/* OPEN RECIPE */
function openRecipe(id){
  let r = recipes.find(x => x.id === id);

  document.getElementById("grid").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("title").innerText = r.name;
  document.getElementById("ingredients").innerText = r.ingredients;
  document.getElementById("instructions").innerText = r.instructions;
  document.getElementById("nutrition").innerText = r.nutrition;
  document.getElementById("img").src = r.image;
}

/* BACK BUTTON */
function goBack(){
  document.getElementById("grid").style.display = "grid";
  document.getElementById("detail").style.display = "none";
}

/* SEARCH FILTER */
function searchRecipe(){
  let input = document.getElementById("search").value.toLowerCase();

  let filtered = recipes.filter(r =>
    r.name.toLowerCase().includes(input)
  );

  renderRecipes(filtered);
}

</script>

</body>
</html>
