<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeHub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff7f0;
}

/* HEADER */
header {
  background: #ff6b00;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  position: relative;
}

/* HAMBURGER */
.menu-btn {
  position: absolute;
  left: 15px;
  top: 15px;
  font-size: 22px;
  cursor: pointer;
}

/* SIDEBAR MENU */
.sidebar {
  position: fixed;
  left: -220px;
  top: 0;
  width: 200px;
  height: 100%;
  background: white;
  box-shadow: 2px 0 10px rgba(0,0,0,0.2);
  padding: 15px;
  transition: 0.3s;
}

.sidebar a {
  display: block;
  padding: 10px;
  text-decoration: none;
  color: #333;
}

/* SEARCH */
.search {
  padding: 10px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 110px;
  object-fit: cover;
}

.card p {
  margin: 8px;
  font-weight: bold;
}

/* DETAIL */
.detail {
  display: none;
  padding: 15px;
}

.detail img {
  width: 100%;
  border-radius: 12px;
}

/* BUTTON */
button {
  background: #ff6b00;
  border: none;
  padding: 10px;
  color: white;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  🍽 RecipeHub
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <a href="#" onclick="showAll()">🏠 Home</a>
  <a href="#" onclick="showFavs()">❤️ Favorites</a>
  <a href="#" onclick="showPlanner()">📅 Meal Planner</a>
  <a href="#" onclick="showShop()">🛒 Shopping List</a>
</div>

<!-- SEARCH -->
<div class="search">
  <input id="search" onkeyup="searchRecipe()" placeholder="Search recipes...">
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- DETAIL -->
<div class="detail" id="detail">

  <img id="img">
  <h2 id="title"></h2>

  <h3>Ingredients</h3>
  <p id="ingredients"></p>

  <h3>Instructions</h3>
  <p id="instructions"></p>

  <h3>Nutrition</h3>
  <p id="nutrition"></p>

  <button onclick="addFav()">❤️ Add to Favorites</button>
  <button onclick="goBack()">⬅ Back</button>
</div>

<script>

/* =========================
   DATABASE (EXPANDABLE TO 100+)
========================= */
const recipes = [
  {id:1,name:"Chicken Adobo",image:"https://source.unsplash.com/300x200/?chicken",ingredients:"Chicken, soy sauce, vinegar, garlic",instructions:"Simmer until tender.",nutrition:"320 kcal"},
  {id:2,name:"Sinigang na Baboy",image:"https://source.unsplash.com/300x200/?soup",ingredients:"Pork, tamarind, vegetables",instructions:"Boil pork, add sour base.",nutrition:"280 kcal"},
  {id:3,name:"Pancit Bihon",image:"https://source.unsplash.com/300x200/?noodles",ingredients:"Noodles, chicken, vegetables",instructions:"Stir fry ingredients.",nutrition:"300 kcal"},
  {id:4,name:"Leche Flan",image:"https://source.unsplash.com/300x200/?dessert",ingredients:"Eggs, milk, sugar",instructions:"Steam until set.",nutrition:"250 kcal"}
];

/* =========================
   STORAGE SYSTEMS
========================= */
let favorites = JSON.parse(localStorage.getItem("fav")) || [];
let meals = JSON.parse(localStorage.getItem("meals")) || [];
let shop = JSON.parse(localStorage.getItem("shop")) || [];

/* =========================
   RENDER RECIPES
========================= */
function renderRecipes(list = recipes){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  list.forEach(r => {
    grid.innerHTML += `
      <div class="card" onclick="openRecipe(${r.id})">
        <img src="${r.image}">
        <p>${r.name}</p>
      </div>
    `;
  });
}
renderRecipes();

/* =========================
   OPEN RECIPE
========================= */
function openRecipe(id){
  let r = recipes.find(x => x.id === id);

  document.getElementById("grid").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("title").innerText = r.name;
  document.getElementById("ingredients").innerText = r.ingredients;
  document.getElementById("instructions").innerText = r.instructions;
  document.getElementById("nutrition").innerText = r.nutrition;
  document.getElementById("img").src = r.image;

  window.current = r;
}

/* =========================
   BACK
========================= */
function goBack(){
  document.getElementById("grid").style.display = "grid";
  document.getElementById("detail").style.display = "none";
}

/* =========================
   SEARCH FILTER
========================= */
function searchRecipe(){
  let input = document.getElementById("search").value.toLowerCase();
  let filtered = recipes.filter(r => r.name.toLowerCase().includes(input));
  renderRecipes(filtered);
}

/* =========================
   FAVORITES SYSTEM
========================= */
function addFav(){
  favorites.push(window.current);
  localStorage.setItem("fav", JSON.stringify(favorites));
  alert("Added to Favorites ❤️");
}

/* =========================
   MENU
========================= */
function toggleMenu(){
  let s = document.getElementById("sidebar");
  s.style.left = (s.style.left === "0px") ? "-220px" : "0px";
}

/* =========================
   SIDEBAR FEATURES (BASIC DEMO)
========================= */
function showAll(){
  renderRecipes();
}

function showFavs(){
  renderRecipes(favorites);
}

function showPlanner(){
  alert("Meal Planner feature (can be expanded)");
}

function showShop(){
  alert("Shopping List feature (can be expanded)");
}
</script>

</body>
</html>
